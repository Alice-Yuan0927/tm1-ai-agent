services:
  tm1-ai-analyst:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-}
      TM1_ADDRESS: ${TM1_ADDRESS:-host.docker.internal}
      TM1_PORT: ${TM1_PORT:-9510}
      TM1_USER: ${TM1_USER:-admin}
      TM1_PASSWORD: ${TM1_PASSWORD-apple}
      TM1_NAMESPACE: ${TM1_NAMESPACE:-}
      TM1_SSL: ${TM1_SSL:-false}
      TM1_VERIFY: ${TM1_VERIFY:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
